<!-- Compatibility redirect: old bookmarks now open the matching section of the one-page portfolio. -->
<!doctype html>
<!-- This redirect page is written in English. -->
<html lang="en">
  <!-- Metadata for browsers opening an older URL. -->
  <head>
    <!-- Support normal text and symbols. -->
    <meta charset="utf-8">
    <!-- Keep the fallback page readable on phones. -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- EDIT: Browser title for this old page address. -->
    <title>Writing | Andrew Wigglesworth</title>
    <!-- Redirect immediately. If the section ID changes, update the fragment after # here. -->
    <meta http-equiv="refresh" content="0;url=index.html#blog">
  </head>
  <!-- Fallback link remains usable if automatic redirects are disabled. -->
  <body>
    <!-- EDIT: Keep this destination identical to the refresh URL above. -->
    <a href="index.html#blog">Continue to Writing</a>
  </body>
</html>
